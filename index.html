<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="BITC - Smart Learning Management System" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="https://image2url.com/r2/default/images/1775396561883-fe483737-a8d0-4867-9e8f-9086b2081e68.jpeg" />
    <link rel="apple-touch-icon" href="https://image2url.com/r2/default/images/1775396561883-fe483737-a8d0-4867-9e8f-9086b2081e68.jpeg" />
    <title>BITC - Smart Learning Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
